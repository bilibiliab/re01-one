```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>小锡恋曲ᨳ ദ的自白</title>
    <style>  
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #ffd166;
            --bg-color: #1a1a2e;
            --card-bg: rgba(255,255,255,0.08);
            --text-color: #fff;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: "Arial Rounded MT Bold", "Microsoft YaHei", sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* 加载动画 */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 头部样式 */
        .header {
            background: url("https://picsum.photos/id/1068/1920/600") center/cover no-repeat;
            text-align: center;
            padding: 80px 20px;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .header::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(26,26,46,0.8));
            z-index: 0;
        }
        
        .avatar-container {
            position: relative;
            margin-bottom: 30px;
            z-index: 1;
        }
        
        .avatar {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid var(--primary-color);
            box-shadow: 0 0 20px rgba(255,107,107,0.6);
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .avatar:hover {
            transform: scale(1.05);
        }
        
        .title {
            margin: 30px 0 15px;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            text-shadow: 0 3px 6px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
        }
        
        .tagline {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--secondary-color);
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* 内容样式 */
        .content {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }
        
        .section-title {
            text-align: center;
            margin: 40px 0 30px;
            font-size: 2rem;
            color: var(--secondary-color);
            position: relative;
        }
        
        .section-title::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: var(--primary-color);
        }
        
        .achievement-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .achievement-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .achievement-card:hover::before {
            left: 100%;
        }
        
        .achievement-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 30px rgba(255,107,107,0.2);
        }
        
        .achievement-link {
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            align-items: center;
        }
        
        .achievement-icon {
            font-size: 28px;
            margin-right: 15px;
            color: var(--secondary-color);
            transition: transform 0.3s ease;
        }
        
        .achievement-link:hover .achievement-icon {
            transform: scale(1.2);
        }
        
        .achievement-text {
            font-size: 20px;
            margin: 0;
            transition: color 0.3s ease;
        }
        
        .achievement-link:hover .achievement-text {
            color: var(--primary-color);
        }
        
        /* 按钮区域 */
        .btn-group {
            text-align: center;
            margin: 60px 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .interactive-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .interactive-btn::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255,255,255,0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }
        
        .interactive-btn:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }
        
        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(20, 20);
                opacity: 0;
            }
        }
        
        .btn-primary {
            background: var(--primary-color);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255,107,107,0.4);
        }
        
        .btn-primary:hover {
            background: #ff4757;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255,71,87,0.5);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--secondary-color);
            border: 2px solid var(--secondary-color);
        }
        
        .btn-secondary:hover {
            background: rgba(255,209,102,0.1);
            transform: scale(1.05);
        }
        
        /* 底部样式 */
        .footer {
            background: url("https://picsum.photos/id/1040/1920/300") center/cover no-repeat;
            text-align: center;
            padding: 50px 20px;
            position: relative;
        }
        
        .footer::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(26,26,46,0.8), rgba(0,0,0,0.6));
            z-index: 0;
        }
        
        .footer-text {
            margin: 0;
            font-size: 18px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
            letter-spacing: 2px;
        }
        
        /* 返回顶部按钮 */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }
        
        .back-to-top:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .header {
                padding: 60px 20px;
            }
            
            .avatar {
                width: 150px;
                height: 150px;
            }
            
            .content {
                margin: 30px auto;
            }
            
            .achievement-card {
                padding: 20px;
            }
            
            .achievement-text {
                font-size: 18px;
            }
            
            .btn-group {
                flex-direction: column;
                align-items: center;
            }
            
            .interactive-btn {
                width: 80%;
                max-width: 300px;
            }
        }
        
        @media (max-width: 480px) {
            .header {
                padding: 40px 15px;
            }
            
            .avatar {
                width: 120px;
                height: 120px;
            }
            
            .achievement-card {
                padding: 15px;
            }
            
            .achievement-text {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- 加载动画 -->
    <div class="loader" id="loader">
        <div class="loader-spinner"></div>
    </div>

    <!-- 头部区域 -->
    <div class="header">
        <div class="avatar-container">
            <img src="https://i.imgs.ovh/2025/11/22/CS86QN.jpeg" alt="小锡恋曲ᨳ ദ" class="avatar">
        </div>
        <h1 class="title">小锡恋曲ᨳ ദ</h1>
        <p class="tagline">热血不止，热爱无界 - 游戏高手与音乐才子的完美结合</p>
    </div>

    <!-- 主要内容区域 -->
    <div class="content">
        <h2 class="section-title">我的成就</h2>
        
        <div class="achievement-card">
            <a href="https://www.163.com/dy/article/9IK9O4G50514R9OJ.html" target="_blank" class="achievement-link" aria-label="查看第五人格成就详情">
                <span class="achievement-icon">🎮</span>
                <p class="achievement-text">《第五人格》最强监管者，掌控全场节奏</p>
            </a>
        </div>
        
        <div class="achievement-card">
            <a href="https://pvp.qq.com/" target="_blank" class="achievement-link" aria-label="查看王者荣耀成就详情">
                <span class="achievement-icon">⚔️</span>
                <p class="achievement-text">《王者荣耀》顶尖海诺玩家，技能精准释放</p>
            </a>
        </div>
        
        <div class="achievement-card">
            <a href="https://y.qq.com/" target="_blank" class="achievement-link" aria-label="查看音乐成就详情">
                <span class="achievement-icon">🎹</span>
                <p class="achievement-text">音乐领域杰出钢琴家，指尖流淌动人旋律</p>
            </a>
        </div>
        
        <div class="achievement-card">
            <a href="#" class="achievement-link" aria-label="查看自信宣言">
                <span class="achievement-icon">🌟</span>
                <p class="achievement-text">自信宣言：我是天下第一帅</p>
            </a>
        </div>
        
        <div class="achievement-card">
            <a href="#" class="achievement-link" aria-label="查看实力展示">
                <span class="achievement-icon">💪</span>
                <p class="achievement-text">实力彰显：我是世界第一强</p>
            </a>
        </div>

    <!-- 按钮区域 -->
    <div class="btn-group">
        <button class="interactive-btn btn-primary" id="moreAchievementsBtn">查看更多成就</button>
        <button class="interactive-btn btn-secondary" id="shareProfileBtn">分享个人主页</button>
    </div>

    <!-- 底部区域 -->
    <div class="footer">
        <p class="footer-text">以热爱之名，赴理想之约</p>
    </div>

    <!-- 返回顶部按钮 -->
    <div class="back-to-top" id="backToTop" aria-label="返回顶部">
        ↑
    </div>

    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 隐藏加载动画
            setTimeout(function() {
                document.getElementById('loader').classList.add('hidden');
            }, 1000);
            
            // 返回顶部功能
            const backToTopBtn = document.getElementById('backToTop');
            
            window.addEventListener('scroll', function() {
                if (window.pageYOffset > 300) {
                    backToTopBtn.classList.add('visible');
                } else {
                    backToTopBtn.classList.remove('visible');
                }
            });
            
            backToTopBtn.addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
            
            // 查看更多成就按钮功能
            document.getElementById('moreAchievementsBtn').addEventListener('click', function() {
                alert('更多精彩成就即将展示，敬请期待！');
            });
            
            // 分享个人主页按钮功能
            document.getElementById('shareProfileBtn').addEventListener('click', function() {
                if (navigator.share) {
                    navigator.share({
                        title: '小锡恋曲ᨳ ദ的自白',
                        text: '来看看小锡恋曲ᨳ ദ的个人展示页面！',
                        url: window.location.href
                    })
                    .catch(error => console.log('分享失败:', error));
                } else {
                    alert('分享功能在此浏览器中不可用，请手动复制链接分享！');
                }
            });
            
            // 为所有卡片添加点击效果
            const cards = document.querySelectorAll('.achievement-card');
            cards.forEach(card => {
                card.addEventListener('click', function(e) {
                    if (e.target.tagName !== 'A') {
                        const link = this.querySelector('a');
                        if (link) {
                            link.click();
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
